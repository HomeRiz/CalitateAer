blueprint:
  name: RNMCA Early Warning Notification
  author: HomeRiz
  description: >
    Notify when a CalitateAer early-warning sensor enters watch or warning state.
    The notification uses the sensor attributes for the top event, direction,
    and estimated arrival time when available.
  source_url: https://github.com/HomeRiz/CalitateAer/blob/main/blueprints/automation/calitateaer/early_warning_notification.yaml
  domain: automation
  input:
    warning_sensor:
      name: Early-warning sensor
      description: >
        Select one RNMCA early-warning sensor created for a monitored point.
      selector:
        entity:
          filter:
            - domain: sensor
          multiple: false
    notify_service:
      name: Notify service
      description: >
        Use a notify service such as notify.mobile_app_your_phone.
      selector:
        text:

mode: queued
max: 10

trigger:
  - platform: state
    entity_id: !input warning_sensor

condition:
  - condition: template
    value_template: >-
      {{
        trigger.to_state is not none
        and trigger.to_state.state in ['watch', 'warning']
        and (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state)
      }}

action:
  - service: !input notify_service
    data:
      title: "RNMCA {{ trigger.to_state.attributes.state_label | default(trigger.to_state.state) | title }}"
      message: >-
        {{ trigger.to_state.attributes.top_event_summary | default('RNMCA early warning active.', true) }}
        Direction: {{ trigger.to_state.attributes.primary_direction_from_poi | default('unknown', true) }}.
        ETA: {{ trigger.to_state.attributes.primary_eta_minutes | default('unknown', true) }} minutes.
